# Builtin lexicon. User files passed with --lexicon are merged on top of this
# one; later files win.
#
# acronyms: keys are matched case-sensitively as whole words (a trailing
#   lowercase "s" is treated as a plural). Per entry:
#     say:    always spoken this way, whatever --acronyms says (pronounced words)
#     spell:  letter-by-letter reading; defaults to the key's letters spaced out
#     expand: full expansion, used when --acronyms=expand
#   A bare string is shorthand for say.
# words: pronunciation overrides, matched case-insensitively.
# handles: exact replacements for @handles, matched case-insensitively.

acronyms:
  API:   { expand: application programming interface }
  APIs:  { say: "A P I's", expand: application programming interfaces }
  AI:    { expand: artificial intelligence }
  ASAP:  { say: "as soon as possible" }
  ASR:   { expand: automatic speech recognition }
  AST:   { expand: abstract syntax tree }
  AWS:   { expand: Amazon Web Services }
