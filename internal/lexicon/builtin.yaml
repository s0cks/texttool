  ML:    { expand: machine learning }
  MVP:   { expand: minimum viable product }
  MVU:   { expand: model view update }
  NER:   { expand: named entity recognition }
  NLP:   { expand: natural language processing }
  OK:    { say: okay }
  ORM:   { expand: object relational mapper }
  OS:    { expand: operating system }
  PDF:   { expand: portable document format }
  PNG:   { expand: "portable network graphics" }
  POS:   { expand: part of speech }
  QA:    { say: "Q A", expand: quality assurance }
  RAM:   { say: ram }
