  TOML:  { say: tomuhl }
  TTS:   { expand: text to speech }
  UDP:   { expand: user datagram protocol }
  UI:    { expand: user interface }
  URI:   { expand: uniform resource identifier }
  URL:   { expand: uniform resource locator }
  USB:   { expand: universal serial bus }
  UUID:  { say: "U U I D" }
  UX:    { expand: user experience }
