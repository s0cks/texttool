---
name: Release texttool executable
on:
  release:
    types:
      - published
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            target: linux-x64
            ext: ""
          - runner: macos-14
            os: darwin
            arch: arm64
            target: macos-arm64
            ext: ""
          - runner: windows-latest
            os: windows
            arch: amd64
            target: win-x64
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Clean version
        id: clean_version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.release.tag_name || 'latest' }}"
          CLEAN_TAG="${RAW_TAG#texttool-v}"
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
      - name: Build
        shell: bash
        run: |
          export CGO_ENABLED=0
          export GOOS=${{ matrix.os }}
          export GOARCH=${{ matrix.arch }}
          go build \
            -trimpath \
            -ldflags="-s -w -X internal.version.Version=${{ steps.clean_version.outputs.tag }}" \
            -o texttool-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} \
            .
      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            texttool-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
