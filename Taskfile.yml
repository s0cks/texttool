version: "3"

tasks:
  build:
    desc: Build the texttool binary
    cmds:
      - go build -o bin/texttool ./cmd/texttool
  test:
    desc: Run all tests
    cmds:
      - go test ./...
  golden:
    desc: Regenerate golden files (review the diff first)
    cmds:
      - go test ./internal/pipeline -update
  vet:
    cmds:
      - go vet ./...
